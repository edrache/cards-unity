name: Coding standards

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    coding-standards:
        name: Validate first-party LOOM files
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Run coding-standard checker
              run: python3 scripts/check_coding_standards.py
